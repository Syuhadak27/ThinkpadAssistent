name: Release Thinkpad Assistant

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOS_APP_ARTIFACT: ThinkpadAssistant.app
  XCBUILD_PATH: build/Build/Products/Release
  ARCHIVE_NAME: ThinkpadAssistant-macOS.zip

jobs:
  release:
    # Runner Intel; deployment target 13.0 => binary jalan di Ventura ke atas.
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (Ventura 13.0+, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThinkpadAssistant.xcodeproj \
            -scheme ThinkpadAssistant \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -quiet \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='x86_64 arm64' 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## xcodebuild failed (exit $status)"
              echo '```'
              tail -n 250 xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3

      - name: Verify app
        run: |
          test -d "${XCBUILD_PATH}/${MACOS_APP_ARTIFACT}"
          codesign --verify --deep --strict "${XCBUILD_PATH}/${MACOS_APP_ARTIFACT}"

      - name: Package
        run: |
          cd "${XCBUILD_PATH}"
          ditto -c -k --keepParent "${MACOS_APP_ARTIFACT}" "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ github.workspace }}/${{ env.ARCHIVE_NAME }}
          retention-days: 30
