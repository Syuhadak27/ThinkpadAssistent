name: Build Thinkpad Assistant

on:
  pull_request:
  push:
    branches-ignore:
      - master
    tags-ignore:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    # Runner Intel; deployment target 13.0 => hasil build jalan di Ventura ke atas.
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Env
        run: pod install

      - name: Build (Ventura 13.0+, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ThinkpadAssistant.xcworkspace \
            -scheme ThinkpadAssistant \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -quiet \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='x86_64 arm64' 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## xcodebuild failed (exit $status)"
              echo '```'
              tail -n 250 xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
